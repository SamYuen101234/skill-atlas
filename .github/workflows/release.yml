name: Release

# Cut a release by pushing a tag: git tag v0.1.0 && git push origin v0.1.0
# workflow_dispatch runs the build only, without touching any release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build (signed + notarized when the Apple secrets are set, unsigned otherwise)
        # The secrets are read into differently named variables and only exported when
        # non-empty: an empty CSC_LINK makes electron-builder treat "" as a certificate
        # path and fail with "<repo root> not a file".
        env:
          SIGN_CERT: ${{ secrets.CSC_LINK }}
          SIGN_CERT_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$SIGN_CERT" ]; then
            echo "Developer ID certificate found - signing."
            export CSC_LINK="$SIGN_CERT"
            export CSC_KEY_PASSWORD="$SIGN_CERT_PASSWORD"
          else
            echo "No CSC_LINK secret - building unsigned (see SIGNING.md)."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -n "$NOTARY_APPLE_ID" ]; then
            export APPLE_ID="$NOTARY_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$NOTARY_PASSWORD"
            export APPLE_TEAM_ID="$NOTARY_TEAM_ID"
          fi
          npx electron-builder --mac --publish never
      - name: Attach the artifacts to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.dmg
            release/*.zip
